# Codex: Astra orchestrator + Luna subagents
#
# Main knobs to change:
#   model / model_reasoning_effort
#   agents.default_subagent_model
#   agents.default_subagent_reasoning_effort
#   agents.max_concurrent_threads_per_session
#
# This is intentionally project-scoped. Put it at:
#   <repo>/.codex/config.toml
#
# For a personal/global setup, merge the same settings into:
#   ~/.codex/config.toml

# Root / orchestrator
model = "gpt-6-astra"
model_reasoning_effort = "medium"

# Ask Codex to use the documented 1M-class context window (1,050,000 tokens)
# for the GPT-5.6/6 models used here (Luna, Terra, Sol, Astra, Daybreak),
# with automatic compaction kept below the working range. The catalog
# override file keeps the larger window from being reset when Codex
# refreshes model metadata. See README, "Model context windows".
model_context_window = 1_050_000
model_auto_compact_token_limit = 900_000
model_auto_compact_token_limit_scope = "total"
model_catalog_json = "~/.codex/models-1m.json"

# Safe interactive defaults. Change if your workflow needs otherwise.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
enabled = true

# Number of child agent threads Codex may keep open concurrently.
# Start with 4-6. Increase only when the work is genuinely parallel.
max_concurrent_threads_per_session = 2

# Default for any spawned subagent that does not explicitly choose a model.
# Plan defaults: Pro uses max Luna reasoning; Plus uses medium Luna reasoning.
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
